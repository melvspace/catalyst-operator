name: ci

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
      - 'helm-v*'
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo run --locked --bin crdgen > /tmp/crds.yaml && diff -u charts/catalyst-operator/crds/resources.yaml /tmp/crds.yaml
      - uses: azure/setup-helm@v4.3.1
      - run: helm lint charts/catalyst-operator --set catalyst.url=https://catalyst.example/api
      - run: helm template test charts/catalyst-operator --include-crds --set catalyst.url=https://catalyst.example/api > /tmp/rendered.yaml

  container:
    if: "!startsWith(github.ref, 'refs/tags/helm-v')"
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
      - name: Log in to GHCR
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: >-
            ${{ github.event_name == 'push' &&
            (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/helm-v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.1
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          printf '%s' "$GHCR_TOKEN" |
          helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Package and publish chart
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          chart_version="$(helm show chart charts/catalyst-operator | awk '$1 == "version:" { print $2 }')"
          release_version="${RELEASE_TAG#helm-v}"

          if [[ "$chart_version" != "$release_version" ]]; then
            echo "Chart version $chart_version does not match tag $RELEASE_TAG" >&2

            exit 1
          fi

          mkdir -p /tmp/codex
          chart_dir="$(mktemp -d /tmp/codex/helm-release.XXXXXX)"
          helm package charts/catalyst-operator --destination "$chart_dir"
          chart_registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          helm push "$chart_dir/catalyst-operator-$chart_version.tgz" "oci://$chart_registry"

  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: container
    runs-on: ubuntu-latest
    concurrency:
      group: release-please-main
      cancel-in-progress: false
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # App-created release tags trigger this workflow to publish versioned images.
      - name: Create release PR or GitHub release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: main
