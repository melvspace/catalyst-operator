name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo run --locked --bin crdgen > /tmp/crds.yaml && diff -u charts/catalyst-operator/crds/resources.yaml /tmp/crds.yaml
      - uses: azure/setup-helm@v4.3.1
      - run: helm lint charts/catalyst-operator --set catalyst.url=https://catalyst.example/api
      - run: helm template test charts/catalyst-operator --include-crds --set catalyst.url=https://catalyst.example/api > /tmp/rendered.yaml
      - run: docker build --tag catalyst-operator:ci .
