[package]
name = "catalyst-operator"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
default-run = "catalyst-operator"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
k8s-openapi = { version = "0.29", features = ["v1_34", "schemars"] }
kube = { version = "5", features = ["runtime", "derive", "rustls-tls", "unstable-runtime"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
wiremock = "0.6"

[profile.release]
lto = "thin"
strip = true
